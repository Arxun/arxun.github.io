<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arxun</title>
  <meta name="description" content="Arxun 的公开页面和静态文件。提交到仓库里的文件，会以固定地址提供。">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a1814'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='16' fill='%23f3efe6'%3EA%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #1a1814;
      --muted: #6f695f;
      --line: #d8d0c3;
      --seal: #b6402a;
      --soft: #e7e1d6;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141311;
        --ink: #ece7dc;
        --muted: #a39b8e;
        --line: #2e2a24;
        --seal: #e07a64;
        --soft: #1d1b18;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--seal) 12%, transparent), transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", serif;
      line-height: 1.6;
    }

    a { color: inherit; }

    .wrap {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mark {
      font-weight: 600;
      text-decoration: none;
    }

    .host { color: var(--muted); }

    main { padding-top: 64px; }

    .kicker {
      margin: 0 0 14px;
      color: var(--seal);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: min(12em, 100%);
      font-size: clamp(36px, 7vw, 68px);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .lead {
      max-width: 36em;
      margin: 22px 0 0;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }

    section { margin-top: 64px; }

    h2 {
      margin: 0 0 16px;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .catalog {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .catalog a {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: baseline;
      padding: 16px 2px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
    }

    .catalog a:hover .name { color: var(--seal); }

    .catalog a:focus-visible {
      outline: 2px solid var(--seal);
      outline-offset: 4px;
    }

    .name { font-size: 22px; }

    .path {
      color: var(--muted);
      font-family: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .note {
      padding: 22px 22px 20px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .note p {
      margin: 0;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    .note p + p { margin-top: 10px; }

    code, .url {
      font-family: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .url {
      color: var(--seal);
      word-break: break-all;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 72px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      font-size: 13px;
    }

    footer a { color: var(--ink); }

    @media (max-width: 640px) {
      .wrap { width: min(760px, calc(100% - 28px)); }
      main { padding-top: 40px; }
      .catalog a { grid-template-columns: 1fr; gap: 4px; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="mark" href="/">Arxun</a>
      <span class="host">静态站点</span>
    </header>

    <main>
      <p class="kicker">arxun.github.io</p>
      <h1>用来放想给人看的东西。</h1>
      <p class="lead">页面、图片、文档，提交进这个仓库就会按相对路径公开。每个文件都有一个固定地址。</p>

      <section aria-labelledby="catalog-title">
        <h2 id="catalog-title">目录</h2>
        <ul class="catalog">
          <!-- 新增一项：复制一个 li，改标题和链接 -->
          <li>
            <a href="/">
              <span class="name">首页</span>
              <span class="path">/</span>
            </a>
          </li>
          <li>
            <a href="/wulai/">
              <span class="name">武来</span>
              <span class="path">/wulai/</span>
            </a>
          </li>
          <li>
            <a href="/files/hello.txt">
              <span class="name">一份示例文件</span>
              <span class="path">/files/hello.txt</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="note" aria-labelledby="howto-title">
        <h2 id="howto-title">放一个文件</h2>
        <p>把文件放进仓库，推到 <code>main</code>。比如根目录的 <code>poster.png</code>，地址是</p>
        <p class="url">https://arxun.github.io/poster.png</p>
      </section>
    </main>

    <footer>
      <span>Arxun</span>
      <a href="https://github.com/Arxun/arxun.github.io">仓库</a>
    </footer>
  </div>
</body>
</html>
